controller_manager:
  ros__parameters:
    # Run slightly above nominal 500Hz in order to get exactly 50hz for neural controller
    # Should develop a better way to handle this in the future
    update_rate: 520


    neural_controller:
      type: neural_controller/NeuralController


    neural_controller_three_legged:
      type: neural_controller/NeuralController


    neural_controller_parkour:
      type: neural_controller/NeuralController


    neural_controller_test:
      type: neural_controller/NeuralController


    # Motion-reference ("mimic") policies: same controller plugin, but the policy
    # observes the reference gait it is tracking, so its observation frame is
    # 48-dim rather than 36. The controller reads that layout out of the policy
    # JSON, so this is just another instance and the four modes above keep
    # working exactly as before.
    neural_controller_mimic:
      type: neural_controller/NeuralController


    # One-shot jump policy (mjlab's Mjlab-Jump-Flat-Pupper-v3): also 48-dim,
    # but the reference slot is a trigger clock rather than a command-blended
    # cycle. Activated by R2 (see estop_controller below); it auto-plays one
    # jump when its fade-in completes, and each further R2 press hops again.
    neural_controller_jump:
      type: neural_controller/NeuralController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster


imu_sensor_broadcaster:
  ros__parameters:
    update_rate: 260
    frame_id: base_link
    sensor_name: imu_sensor


neural_controller:
  ros__parameters:
    repeat_action: 10


    gain_multiplier: 1.0
    estop_kd: 0.1


    joint_names:
      [
        "leg_front_r_1",
        "leg_front_r_2",
        "leg_front_r_3",
        "leg_front_l_1",
        "leg_front_l_2",
        "leg_front_l_3",
        "leg_back_r_1",
        "leg_back_r_2",
        "leg_back_r_3",
        "leg_back_l_1",
        "leg_back_l_2",
        "leg_back_l_3",
      ]


    default_joint_pos:
      [0.26, 0.0, -0.52, -0.26, 0.0, 0.52, 0.26, 0.0, -0.52, -0.26, 0.0, 0.52]


    init_kps: [7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5]


    # Three motors on this robot are weak relative to the rest, so they run stiffer
    # to track the same command: leg_front_l_2 (index 4), leg_front_l_3 (index 5)
    # and leg_back_r_3 (index 8), each scaled by 1.2 on this policy's kp of 5.0 for
    # an effective gain of 6.0. leg_back_r_3 was at 1.5 (7.5) and was too stiff.
    # Per-joint trim on top of the policy's kp -- the policy JSON stamps kp as one
    # scalar for all twelve joints, so this cannot be expressed by editing kps here,
    # and gain_multiplier would hit kd and every other joint too. The scale is
    # relative, so it targets 6.0 only for a policy whose kp is 5.0 -- retune
    # whenever the checkpoint's kp changes.
    kp_scale: [1.0, 1.0, 1.0, 1.0, 1.2, 1.2, 1.0, 1.0, 1.2, 1.0, 1.0, 1.0]
    init_kds:
      [0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25]


    init_duration: 2.0
    fade_in_duration: 2.0


    action_types:
      [
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
      ]


    max_body_angle: 1.5


    model_path: "$(find-pkg-share neural_controller)/launch/policy_latest.json"


