# Motion-reference ("mimic") policy exported from mjlab's Pupper gait tasks.
#
# Everything the policy itself pins down -- kp, kd, action scale, default pose,
# joint limits, observation history, observation frame size and the gait reference
# tables -- comes from mimic_policy.json, so this section only carries what the
# controller needs before the JSON is read.
neural_controller_mimic:
  ros__parameters:
    repeat_action: 10


    gain_multiplier: 1.0
    estop_kd: 0.1


    joint_names:
      [
        "leg_front_r_1",
        "leg_front_r_2",
        "leg_front_r_3",
        "leg_front_l_1",
        "leg_front_l_2",
        "leg_front_l_3",
        "leg_back_r_1",
        "leg_back_r_2",
        "leg_back_r_3",
        "leg_back_l_1",
        "leg_back_l_2",
        "leg_back_l_3",
      ]


    default_joint_pos:
      [0.26, 0.0, -0.52, -0.26, 0.0, 0.52, 0.26, 0.0, -0.52, -0.26, 0.0, 0.52]


    init_kps: [7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5, 7.5]
    init_kds:
      [0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25, 0.25]


    init_duration: 2.0
    fade_in_duration: 2.0


    action_types:
      [
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
        "position",
      ]


    # Permissive while the trot is being brought up on hardware; tighten toward
    # the 0.52 the walking modes use once it is trusted.
    max_body_angle: 1.5


    model_path: "$(find-pkg-share neural_controller)/launch/mimic_policy.json"


# Joystick controller switching. Set explicitly here (rather than relying on the
# compiled-in defaults, which differ between the upstream monorepo and lab 5) so
# the mimic mode gets a button without disturbing the existing four.
#   x = walk, o = three-legged, triangle = parkour, square = test, L1 = mimic
estop_controller:
  ros__parameters:
    switch_button_indices: [0, 1, 2, 3, 4]
    controller_names:
      [
        "neural_controller",
        "neural_controller_three_legged",
        "neural_controller_parkour",
        "neural_controller_test",
        "neural_controller_mimic",
      ]


teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1
      y: 0
    scale_linear:
      # Full stick = 1.25 m/s: the mixed-gaits band (trot 0-0.5, reach 0.5-1.25).
      # The reach onset itself comes from the policy JSON's gallop_speed, so the
      # stick position where the gait switches is 0.5/1.25 = 40% deflection.
      x: 1.25
      y: 0.5


    axis_angular:
      yaw: 3
    scale_angular:
      yaw: 2.0


    require_enable_button: false


joy_node:
  ros__parameters:
    dev: "/dev/input/js0"
    autorepeat_rate: 50.0
    coalesce_interval: 0.02


joint_state_broadcaster:
  ros__parameters:
    update_rate: 260
    use_local_topics: false


